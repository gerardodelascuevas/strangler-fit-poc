server:
  port: 8081

spring:
  application:
    name: modern-catalog

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:moderncatalog;DB_CLOSE_DELAY=-1}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.modern.catalog: INFO
    org.springframework: WARN
