upstream legacy {
    server legacy-catalog:8080;
}

upstream modern {
    server modern-catalog:8081;
}

server {
    listen 80;
    server_name localhost;

    # Legacy SOAP service — routes to the old Axis2 WAR
    location /services/ {
        proxy_pass http://legacy/services/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Modern REST API — routes to Spring Boot
    location /api/ {
        proxy_pass http://modern/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI — modern service documentation
    location /swagger-ui.html {
        proxy_pass http://modern/swagger-ui.html;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://modern/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /api-docs {
        proxy_pass http://modern/api-docs;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://modern/v3/api-docs;
        proxy_set_header Host $host;
    }

    # Default — show a simple status page
    location / {
        default_type text/html;
        return 200 '
        <html>
        <head><title>Strangler Fig Router</title></head>
        <body style="font-family:monospace;max-width:600px;margin:40px auto">
            <h1>Strangler Fig Pattern - API Router</h1>
            <h2>Legacy (SOAP)</h2>
            <ul>
                <li><a href="/services/ProductCatalogService?wsdl">WSDL</a></li>
            </ul>
            <h2>Modern (REST)</h2>
            <ul>
                <li><a href="/api/products/reports/health">Health Check</a></li>
                <li><a href="/api/products/reports/inventory">Inventory Report</a></li>
                <li><a href="/api/products/reports/categories">Category Summaries</a></li>
                <li><a href="/api/products/reports/search?q=">Search Products</a></li>
                <li><a href="/swagger-ui.html">Swagger UI</a></li>
            </ul>
        </body>
        </html>';
    }
}
